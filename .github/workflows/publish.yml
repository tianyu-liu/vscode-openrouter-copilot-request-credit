name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json (without the v prefix)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vscode-marketplace
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'tianyu-liu/vscode-openrouter-copilot-request-credit'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check version and source
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF" == "refs/tags/v$version" ]]
          else
            [[ "$GITHUB_REF" == refs/heads/main && "$INPUT_VERSION" == "$version" ]]
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: xvfb-run -a npm test
      - run: xvfb-run -a npm run test:groups
      - name: Package and hash the tested source
        run: |
          mkdir release
          npm run package -- --out release/extension.vsix
          cd release
          sha256sum extension.vsix > extension.vsix.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-${{ steps.release.outputs.version }}
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: extension-${{ needs.build.outputs.version }}
          path: release
      - name: Publish the tested VSIX via Trusted Publishing
        run: |
          (cd release && sha256sum -c extension.vsix.sha256)
          npx --no-install vsce publish --oidc --packagePath release/extension.vsix \
            --allow-proposed-apis chatProvider languageModelThinkingPart
      - name: Verify the public Marketplace package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          curl --fail --silent --show-error --location --compressed --retry 8 --retry-all-errors \
            --retry-delay 15 --max-time 40 \
            "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/tianyu-liu/vsextensions/openrouter-copilot-request-credit/$VERSION/vspackage" \
            --output release/marketplace.vsix
          cmp release/extension.vsix release/marketplace.vsix
